name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Export YOLO11n to TFLite (bundled model)
        continue-on-error: true
        run: |
          set +e
          {
          pip install ultralytics
          pip install "tensorflow-cpu<2.20" tf_keras onnx onnx2tf onnxslim onnxruntime sng4onnx psutil ai-edge-litert
          pip install onnx_graphsurgeon --extra-index-url https://pypi.ngc.nvidia.com
          curl -fsSL -o yolo11n.pt https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt
          yolo export model=yolo11n.pt format=tflite imgsz=640 half=False
          ls -R yolo11n_saved_model
          } > export.log 2>&1
          mkdir -p app/src/main/assets
          F=$(find . -name "yolo11n_float32.tflite" | head -1)
          if [ -n "$F" ]; then cp "$F" app/src/main/assets/yolo_default.tflite; echo "COPIED $F" >> export.log; fi
          ls -la app/src/main/assets >> export.log
      - name: Push export log
        if: always()
        run: |
          git config user.email ci@falcon.local; git config user.name ci
          git checkout -B ci-logs
          tail -n 80 export.log > ci-export.log
          git add -f ci-export.log && git commit -qm "export log" && git push -f origin ci-logs
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Restore keystore
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KS_FILE=$RUNNER_TEMP/release.p12" >> $GITHUB_ENV
          echo "KS_PASS=$KS_PASS_SECRET" >> $GITHUB_ENV
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS_SECRET: ${{ secrets.KS_PASS }}
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect
        run: cp app/build/outputs/apk/release/app-release.apk FalconPilot.apk
      - uses: actions/upload-artifact@v4
        with: { name: FalconPilot, path: FalconPilot.apk }
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "v1.0.${{ github.run_number }}" FalconPilot.apk --title "Falcon Pilot 1.0.${{ github.run_number }}" --notes "Release APK (arm64)"
